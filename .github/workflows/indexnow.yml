name: Tawazon IndexNow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content.json'
      - 'build_site.mjs'
      - 'index.html'
      - 'sitemap.xml'
      - 'public/7c4a9d2e6f1b8c3a5d0e7f2b9a4c6d1e.txt'
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: read

env:
  SITE: https://tawazon-health.vercel.app
  KEY: 7c4a9d2e6f1b8c3a5d0e7f2b9a4c6d1e

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit key discovery pages
        run: |
          set -euo pipefail
          for path in \
            / \
            /sitemap.xml \
            /library.html \
            /tools.html \
            /article-healthy-weight-loss.html \
            /article-calories-guide.html \
            /article-belly-fat.html \
            /article-protein-basics.html \
            /article-better-sleep.html \
            /article-walking-after-meals.html; do
            url="${SITE}${path}"
            encoded=$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$url")
            status=$(curl -sS --retry 3 --max-time 20 -o /tmp/indexnow-response -w '%{http_code}' "https://api.indexnow.org/indexnow?url=${encoded}&key=${KEY}")
            case "$status" in 200|202) echo "IndexNow ${path} -> HTTP ${status}" ;; *) echo "IndexNow ${path} -> HTTP ${status}"; cat /tmp/indexnow-response; exit 1 ;; esac
          done

      - name: Publish Tawazon feed to WebSub
        continue-on-error: true
        run: |
          set -euo pipefail
          curl --fail-with-body --max-time 20 -X POST \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'hub.mode=publish' \
            --data-urlencode "hub.url=${SITE}/feed.xml" \
            https://pubsubhubbub.appspot.com/
