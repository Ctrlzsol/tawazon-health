name: Tawazon IndexNow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content.json'
      - 'build_site.mjs'
      - 'index.html'
      - 'sitemap.xml'
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: read

env:
  SITE: https://tawazon-health.vercel.app
  KEY: 7c4a9d2e6f1b8c3a5d0e7f2b9a4c6d1e

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit key discovery pages
        continue-on-error: true
        run: |
          set -euo pipefail
          for path in \
            / \
            /sitemap.xml \
            /library.html \
            /tools.html \
            /article-healthy-weight-loss.html \
            /article-calories-guide.html \
            /article-belly-fat.html \
            /article-protein-basics.html \
            /article-better-sleep.html \
            /article-walking-after-meals.html; do
            url="${SITE}${path}"
            encoded=$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$url")
            curl --fail-with-body --retry 3 --max-time 20 "https://api.indexnow.org/indexnow?url=${encoded}&key=${KEY}"
          done
