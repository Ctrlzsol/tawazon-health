name: SEO Live Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run seo:live-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-live-audit
          path: seo-live-audit.json
          if-no-files-found: ignore
