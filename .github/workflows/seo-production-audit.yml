name: SEO Production Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/seo-production-audit.mjs
      - run: node scripts/seo-production-audit.mjs
